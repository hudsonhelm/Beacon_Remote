name: CodeQL analysis

on:
  push:
  pull_request:
  schedule:
    - cron: "0 20 * * 4"

permissions:
  actions: read
  contents: read

jobs:
  codeql:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
          upload: never

      - name: Verify SARIF report
        shell: bash
        run: |
          test -s codeql-results/javascript.sarif
          jq -e '.runs | length > 0' codeql-results/javascript.sarif >/dev/null

      - name: Preserve CodeQL report
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results-${{ github.sha }}
          path: codeql-results/javascript.sarif
          if-no-files-found: error
          retention-days: 30
